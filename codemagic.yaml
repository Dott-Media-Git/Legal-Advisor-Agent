workflows:
  ios-release:
    name: Legal Advisor iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Code Magic Legal Advisor/agent"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.losai.legaladvisor.ios
      xcode: latest
    scripts:
      - name: Install iOS dependencies
        script: |
          npm ci
          npx cap sync ios
          cd ios/App
          pod install
      - name: Apply automatic signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
        release_type: AFTER_APPROVAL



